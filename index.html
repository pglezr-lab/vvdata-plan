  <title>VVData · Tablero Ejecutivo de Avance</title>
  <link rel="icon" type="image/png" href="./VVData-icono-transparente.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Efecto de resplandor vivo en la tarjeta activa */
    @keyframes pulseGlow {
      0%, 100% {
        box-shadow: 0 4px 20px -2px rgba(245, 158, 11, 0.22), 0 0 0 1.5px rgba(251, 191, 36, 0.7);
      }
      50% {
        box-shadow: 0 8px 32px 3px rgba(245, 158, 11, 0.45), 0 0 0 2.5px rgba(245, 158, 11, 0.95);
      }
    }
    .animate-glow-amber {
      animation: pulseGlow 2.6s infinite ease-in-out;
    }

    /* Brillo de luz que recorre la barra de progreso */
    @keyframes shimmerSweep {
      0% { transform: translateX(-150%) skewX(-20deg); }
      100% { transform: translateX(250%) skewX(-20deg); }
    }
    .animate-shimmer {
      animation: shimmerSweep 3.2s infinite ease-in-out;
    }

    /* Efecto radar expansivo */
    @keyframes radarPulse {
      0% { transform: scale(1); opacity: 0.9; }
      100% { transform: scale(2.4); opacity: 0; }
    }
    .animate-radar {
      animation: radarPulse 1.8s infinite cubic-bezier(0, 0, 0.2, 1);
    }

    /* Animación sutil para invitar a dar clic en los desplegables */
    @keyframes inviteBounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(2.5px); }
    }
    .animate-invite-chevron {
      animation: inviteBounce 1.6s infinite ease-in-out;
    }

    @keyframes invitePulseRing {
      0%, 100% {
        box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.28);
      }
      50% {
        box-shadow: 0 0 0 5px rgba(16, 185, 129, 0);
      }
    }
    .animate-invite-pill {
      animation: invitePulseRing 2.4s infinite ease-in-out;
    }

    /* Vibración suave en caso de contraseña incorrecta */
    @keyframes shakeError {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }
    .animate-shake {
      animation: shakeError 0.38s ease-in-out;
    }

    /* Acordeón suave para secciones colapsables */
    .accordion-grid {
      display: grid;
      grid-template-rows: 0fr;
      opacity: 0;
      transition: grid-template-rows 0.38s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.28s ease, margin-top 0.28s ease;
      margin-top: 0;
    }
    .accordion-grid.is-open {
      grid-template-rows: 1fr;
      opacity: 1;
      margin-top: 0.85rem;
    }
    .accordion-inner {
      overflow: hidden;
    }

    body {
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
    }
  </style>
</head>

  <!-- PANTALLA DE ACCESO PRIVADO CON CIFRADO DE 256 BITS -->
  <div id="auth-gate" class="min-h-screen flex flex-col items-center justify-center px-4 py-10 bg-gradient-to-br from-slate-900 via-emerald-950 to-slate-900 relative overflow-hidden">

    <div id="auth-card" class="w-full max-w-md bg-white/95 backdrop-blur-xl rounded-3xl p-6 sm:p-8 border border-emerald-200/60 shadow-2xl shadow-black/40 relative z-10">
      <div class="flex flex-col items-center text-center">
        <div class="w-16 h-16 sm:w-20 sm:h-20 rounded-2xl bg-emerald-50 border border-emerald-200 flex items-center justify-center p-2.5 shadow-md shadow-emerald-900/10 mb-4">
          <img src="./VVData-icono-transparente.png" alt="VVData" class="w-full h-full object-contain">
        </div>

        <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-emerald-50 text-emerald-800 border border-emerald-200 text-[11px] font-extrabold uppercase tracking-wider mb-2">
          <svg class="w-3.5 h-3.5 text-emerald-600" fill="none" stroke="currentColor" stroke-width="2.3" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
          Acceso Confidencial Cifrado
        </span>

        <h1 class="text-xl sm:text-2xl font-black text-slate-900 tracking-tight">VVData · Vuélvete Verde</h1>
        <p class="text-xs sm:text-sm text-slate-500 mt-1.5 leading-relaxed">
          Tablero Ejecutivo de Avance y Hoja de Ruta. Ingresa la clave del proyecto para desencriptar el contenido.
        </p>
      </div>

      <form id="auth-form" class="mt-6 space-y-4" onsubmit="handlePortalUnlock(event)">
        <div>
          <label for="portal-pass" class="block text-xs font-extrabold text-slate-700 uppercase tracking-wider mb-1.5">
            Contraseña del Proyecto
          </label>
          <div class="relative">
            <input
              id="portal-pass"
              type="password"
              required
              autocomplete="current-password"
              placeholder="Ingresa la contraseña..."
              class="w-full bg-slate-50 border border-slate-300 rounded-xl pl-4 pr-11 py-3 text-base sm:text-sm text-slate-900 font-semibold placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 focus:bg-white transition"
            >
            <button
              type="button"
              onclick="togglePasswordVisibility()"
              class="absolute inset-y-0 right-0 px-3.5 flex items-center text-slate-400 hover:text-slate-700 focus:outline-none cursor-pointer"
              aria-label="Mostrar u ocultar contraseña"
            >
              <svg id="eye-icon" class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
              </svg>
            </button>
          </div>
          <p id="auth-error" class="hidden text-xs font-bold text-red-600 mt-2 flex items-center gap-1.5">
            <span>⚠️</span>
            <span>Contraseña incorrecta. Verifica e intenta nuevamente.</span>
          </p>
        </div>

        <label class="flex items-center gap-2.5 cursor-pointer select-none pt-0.5">
          <input
            id="remember-device"
            type="checkbox"
            checked
            class="w-4 h-4 rounded border-slate-300 text-emerald-600 focus:ring-emerald-500 cursor-pointer"
          >
          <span class="text-xs font-medium text-slate-600">Recordar acceso en este dispositivo</span>
        </label>

        <button
          id="unlock-btn"
          type="submit"
          class="w-full py-3.5 px-5 rounded-xl bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white font-black text-sm shadow-lg shadow-emerald-900/25 flex items-center justify-center gap-2 transition-all duration-200 active:scale-[0.98] cursor-pointer"
        >
          <span id="unlock-btn-text">Desbloquear Tablero Ejecutivo</span>
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
        </button>
      </form>

      <div class="mt-6 pt-4 border-t border-slate-100 text-center">
        <p class="text-[11px] text-slate-400">
          Protegido con cifrado de 256 bits · Dirección Técnica: <strong class="text-slate-600">Pedro González</strong>
        </p>
      </div>
    </div>
  </div>

    }

    function bytesToHex(bytes) {
      return Array.from(bytes).map(b => b.toString(16).padStart(2, '0')).join('');
    }

    function base64ToBytes(b64) {
      const bin = atob(b64);
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) {
        bytes[i] = bin.charCodeAt(i);
      }
      return bytes;
    }

    function concatBytes(...arrays) {
      const total = arrays.reduce((acc, a) => acc + a.length, 0);
      const res = new Uint8Array(total);
      let offset = 0;
      for (const a of arrays) {
        res.set(a, offset);
        offset += a.length;
      }
      return res;
    }

    function deriveMasterKey(normalizedPass, saltBytes, rounds) {
      const passBytes = new TextEncoder().encode(normalizedPass);
      let state = sha256Bytes(concatBytes(saltBytes, passBytes));
      const block = new Uint8Array(32 + saltBytes.length + 4);
      block.set(saltBytes, 32);
      const view = new DataView(block.buffer);
      for (let i = 0; i < rounds; i++) {
        block.set(state, 0);
        view.setUint32(32 + saltBytes.length, i, false);
        state = sha256Bytes(block);
      }
      return state;
    }

    function tryDecryptWithMasterKey(masterKeyBytes) {
      const saltBytes = hexToBytes(CRYPTO_PAYLOAD.saltHex);
      const cipherBytes = base64ToBytes(CRYPTO_PAYLOAD.cipherBase64);
      const encKey = sha256Bytes(concatBytes(masterKeyBytes, new TextEncoder().encode('ENC')));
      const macKey = sha256Bytes(concatBytes(masterKeyBytes, new TextEncoder().encode('MAC')));

      const computedTag = bytesToHex(sha256Bytes(concatBytes(macKey, saltBytes, cipherBytes)));
      if (computedTag !== CRYPTO_PAYLOAD.authTag) {
        return null;
      }

      const plainBytes = new Uint8Array(cipherBytes.length);
      const totalBlocks = Math.ceil(cipherBytes.length / 32);
      const ctrBlock = new Uint8Array(32 + saltBytes.length + 4);
      ctrBlock.set(encKey, 0);
      ctrBlock.set(saltBytes, 32);
      const ctrView = new DataView(ctrBlock.buffer);

      for (let b = 0; b < totalBlocks; b++) {
        ctrView.setUint32(32 + saltBytes.length, b, false);
        const keystream = sha256Bytes(ctrBlock);
        const offset = b * 32;
        const limit = Math.min(32, cipherBytes.length - offset);
        for (let j = 0; j < limit; j++) {
          plainBytes[offset + j] = cipherBytes[offset + j] ^ keystream[j];
        }
      }

      return new TextDecoder('utf-8').decode(plainBytes);
    }

    function renderUnlockedPortal(decryptedHtml) {
      const gate = document.getElementById('auth-gate');
      const root = document.getElementById('protected-root');
      root.innerHTML = decryptedHtml;
      gate.classList.add('hidden');
      root.classList.remove('hidden');
      root.classList.add('flex');
    }

    function handlePortalUnlock(e) {
      e.preventDefault();
      const input = document.getElementById('portal-pass');
      const err = document.getElementById('auth-error');
      const card = document.getElementById('auth-card');
      const remember = document.getElementById('remember-device').checked;

      err.classList.add('hidden');
      const normalized = input.value.trim().toLowerCase();
      if (!normalized) return;

      const saltBytes = hexToBytes(CRYPTO_PAYLOAD.saltHex);
      const masterKey = deriveMasterKey(normalized, saltBytes, CRYPTO_PAYLOAD.rounds);
      const decryptedHtml = tryDecryptWithMasterKey(masterKey);

      if (!decryptedHtml) {
        err.classList.remove('hidden');
        card.classList.remove('animate-shake');
        void card.offsetWidth;
        card.classList.add('animate-shake');
        input.select();
        return;
      }

      if (remember) {
        try {
          localStorage.setItem(STORAGE_KEY, bytesToHex(masterKey));
        } catch (_) {}
      } else {
        try {
          localStorage.removeItem(STORAGE_KEY);
        } catch (_) {}
      }

      input.value = '';
      renderUnlockedPortal(decryptedHtml);
    }

    function lockPortalSession() {
      try {
        localStorage.removeItem(STORAGE_KEY);
      } catch (_) {}
      const gate = document.getElementById('auth-gate');
      const root = document.getElementById('protected-root');
      root.innerHTML = '';
      root.classList.add('hidden');
      root.classList.remove('flex');
      gate.classList.remove('hidden');
      const input = document.getElementById('portal-pass');
      if (input) input.focus();
    }

    function togglePasswordVisibility() {
      const input = document.getElementById('portal-pass');
      if (!input) return;
      input.type = input.type === 'password' ? 'text' : 'password';
    }

    function toggleAccordion(bodyId, labelId, chevronId, closedText, openText) {
      const body = document.getElementById(bodyId);
      const label = document.getElementById(labelId);
      const chevron = document.getElementById(chevronId);
      if (!body || !label || !chevron) return;

      const isOpen = body.classList.toggle('is-open');
      label.textContent = isOpen ? openText : closedText;
      chevron.style.transform = isOpen ? 'rotate(180deg)' : 'rotate(0deg)';
      if (isOpen) {
        chevron.classList.remove('animate-invite-chevron');
      } else {
        chevron.classList.add('animate-invite-chevron');
      }
    }

    function sendWhatsAppComment(e) {
      e.preventDefault();
      const name = document.getElementById('userName').value.trim();
      const topic = document.getElementById('taskSelect').value;
      const comment = document.getElementById('userComment').value.trim();

      const text = `Hola Pedro, soy ${name}.\n\nRevisé el Plan de Trabajo de VVData y sobre el tema *${topic}* tengo el siguiente comentario:\n\n"${comment}"`;
      const encodedText = encodeURIComponent(text);
      window.open(`https://wa.me/?text=${encodedText}`, '_blank');
    }

    // Auto-desbloqueo instantáneo si el dispositivo ya fue autorizado previamente
    (function autoUnlockIfRemembered() {
      try {
        const savedHex = localStorage.getItem(STORAGE_KEY);
        if (savedHex && savedHex.length === 64) {
          const masterKey = hexToBytes(savedHex);
          const decryptedHtml = tryDecryptWithMasterKey(masterKey);
          if (decryptedHtml) {
            renderUnlockedPortal(decryptedHtml);
            return;
          }
          localStorage.removeItem(STORAGE_KEY);
        }
      } catch (_) {}
    })();
  </script>
